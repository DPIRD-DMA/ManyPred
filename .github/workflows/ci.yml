name: CI

# Jobs, by trigger:
# - push to main: Linux only, ruff + the fast test tier + the docs build
# - pull requests, weekly, manual: also macOS (MPS), Windows and the oldest supported
#   numpy / torch / rasterio
# - weekly, manual: also the slow tier (real OCM weights, parity with OCM called live)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 17 * * 0" # Sundays 17:00 UTC, Mondays 01:00 AWST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: linux-${{ matrix.python-version }}

      # CPU-only torch: no GPU here, and the CUDA build pulls ~3 GB of wheels
      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[geo]" --group test

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Fast tier
        run: uv run pytest -n 4 -q

  quantized:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          cache-suffix: quantized

      # torchao only here: the other jobs skip tests/test_quantized.py
      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[geo]" --group test "torchao>=0.18"

      - name: Quantised models
        run: uv run pytest -q tests/test_quantized.py

  docs:
    name: docs (as Read the Docs builds them)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          cache-suffix: docs

      # the Python and the install in .readthedocs.yaml; keep them in step. The index strategy
      # is pip's: uv's default takes every package the PyTorch index has from there, which
      # includes a setuptools too old to read pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install --index-strategy unsafe-best-match -r docs/requirements.txt ".[geo]"

      - name: Build, failing on warnings
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build

  macos:
    name: macOS (MPS) / Python 3.14
    if: ${{ github.event_name != 'push' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
          cache-suffix: macos

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[geo]" --group test

      # the runner VM exposes a paravirtualised Metal GPU, so MPS tests run
      - name: Fast tier and MPS
        run: uv run pytest -n 3 -q -m "not slow and not network and not cuda"

  windows:
    name: Windows / Python 3.12
    if: ${{ github.event_name != 'push' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          cache-suffix: windows

      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[geo]" --group test

      - name: Fast tier
        run: uv run pytest -n 4 -q

  oldest:
    name: oldest supported numpy / torch / rasterio (Python 3.11)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.11"
          cache-suffix: oldest

      # the lower bounds in pyproject.toml; keep them in step
      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[geo]" --group test \
            "numpy==1.24.*" "torch==2.3.*" "rasterio==1.3.*" "tqdm==4.*"

      - name: Fast tier
        run: uv run pytest -n 4 -q

  slow:
    name: slow tier (OCM weights, live parity)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.14"
      UV_NO_SYNC: "1"
      MANYPRED_OCM_WEIGHTS: ${{ github.workspace }}/.ocm_weights
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
          cache-suffix: slow

      - name: Install (with OmniCloudMask at the pinned commit)
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[geo]" --group test --group parity --group notebooks

      - name: Cache OCM weights
        uses: actions/cache@v5
        with:
          path: ${{ env.MANYPRED_OCM_WEIGHTS }}
          key: ocm-weights-v4

      - name: Download OCM weights
        run: >
          uv run python -c "import os; from omnicloudmask.download_models import get_models;
          get_models(model_dir=os.environ['MANYPRED_OCM_WEIGHTS'])"

      - name: Slow tier
        run: uv run pytest -n 4 -q -m "not cuda and not mps"
